# 1. FRONTEND: Public Facing Website
server {
    listen 80;
    server_name miraclewebtechnologies.com ://miraclewebtechnologies.com;
    root /var/www/html/frontend/web;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 32M;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass app:9000;
        try_files $uri =404;
    }

    location ~ /\.(ht|git) { deny all; }
}

# 2. BACKEND: Secure Administrative Control Panel
server {
    listen 80;
    server_name ://miraclewebtechnologies.com;
